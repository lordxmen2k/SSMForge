[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmforge"
version = "0.1.6"
description = "Standalone HF architecture analyzer (`ssmforge arch`). Inspects any HuggingFace model and reports architectural quirks — attention biases, fused QKV/gate-up, tied embeddings, GQA, MQA, MoE, sliding window, LayerScale, soft-capping, partial RoPE, MLP type, norm type. Outputs structured JSON + human-readable summary."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "SSMForge Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "transformers>=4.45",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "wheel>=0.40",
]

[project.scripts]
ssmforge = "ssmforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pin basetemp to avoid Windows permission errors when scanning %TEMP%
# for old test directories. Creates /tmp/pytest-ssmforge/ on first run.
# Override with `pytest --basetemp=DIR` or SSMFORGE_BASETEMP env var.
addopts = "--basetemp=/tmp/pytest-ssmforge"
